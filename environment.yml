name: visual-transit
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 版本
  - python=3.10

  # 核心数据科学库
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0

  # 图与地理数据处理
  - networkx>=3.0
  - geopandas>=0.13.0
  - shapely>=2.0.0
  - fiona>=1.9.0
  - pyproj>=3.5.0

  # 遗传算法与多目标优化
  - deap>=1.3.0
  - pymoo>=0.6.0

  # 可视化
  - matplotlib>=3.7.0

  # LLM API 客户端
  - openai>=1.0.0
  - ollama>=0.1.0

  # 其他工具
  - pip
  - pip:
    # func-timeout 用于算子超时控制
    - func-timeout>=4.3.5
